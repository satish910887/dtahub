<h1 data-en="How to merge PDF files on your phone" data-hi="फोन पर PDF फाइलें कैसे जोड़ें">Merge PDF</h1>
<p data-en="Applications, job forms and bills often need many documents as one PDF. You can combine them in a minute without installing any app." data-hi="एप्लीकेशन, जॉब फॉर्म और बिल में अक्सर कई दस्तावेज़ एक PDF में चाहिए होते हैं। बिना कोई ऐप डाउनलोड किए आप एक मिनट में जोड़ सकते हैं।">Intro.</p>
<h2 data-en="Steps" data-hi="स्टेप्स">Steps</h2>
<ol>
<li data-en="Open the Merge PDF tool." data-hi="Merge PDF टूल खोलें।">Open</li>
<li data-en="Tap the box and add two or more PDF files." data-hi="बॉक्स पर टैप करके दो या ज़्यादा PDF जोड़ें।">Add</li>
<li data-en="Use the arrow buttons to set the order." data-hi="तीर वाले बटन से क्रम तय करें।">Order</li>
<li data-en="Tap Merge and Download." data-hi="Merge and Download दबाएं।">Merge</li>
</ol>
<h2 data-en="Tips" data-hi="टिप्स">Tips</h2>
<ul>
<li data-en="Password-protected PDFs must be unlocked first." data-hi="पासवर्ड वाली PDF को पहले अनलॉक करना होगा।">Password</li>
<li data-en="Have photos instead? Use Image to PDF first, then merge." data-hi="फोटो हैं? पहले Image to PDF इस्तेमाल करें, फिर जोड़ें।">Photos</li>
</ul>
<p>Your files stay on your phone and are never uploaded.</p>
