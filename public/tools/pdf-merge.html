<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge PDF - DTAhub</title>
<meta name="description" content="Free PDF merger. Combine many PDF files into one. Private, works on your device.">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/tool.css">
</head>
<body>
<div class="bg-glow"></div>
<main class="tw">
<a class="back" href="/#tools" data-en="← All tools" data-hi="← सभी टूल्स">← All tools</a>
<h1 data-en="Merge PDF" data-hi="PDF जोड़ें">Merge PDF</h1>
<p class="lead" data-en="Combine many PDFs into one. Files stay on your phone." data-hi="कई PDF को एक बनाएं। फाइलें आपके फोन पर ही रहती हैं।">Merge.</p>
<div class="panel">
 <label class="drop"><input id="f" type="file" accept="application/pdf,.pdf" multiple><span data-en="Tap to add PDF files" data-hi="PDF फाइलें जोड़ने के लिए टैप करें">Tap to add PDF files</span></label>
 <ul class="fl" id="list"></ul>
 <div class="err" id="err" hidden></div>
 <div class="ok" id="ok" hidden></div>
 <div class="seg"><button class="btn gold" id="go" data-en="Merge and Download" data-hi="जोड़ें और डाउनलोड करें">Merge and Download</button><button class="btn" id="clr" data-en="Clear" data-hi="साफ करें">Clear</button></div>
</div>
</main>
<script src="/js/vendor/pdf-lib.min.js"></script>
<script src="/js/tool.js"></script>
<script src="/js/img.js"></script>
<script>
var files=[];
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function render(){
 $("list").innerHTML=files.map(function(f,i){
  return '<li><span class="nm">'+esc(f.name)+'<small>'+sizeOf(f.size)+'</small></span><button class="mini" data-i="'+i+'" data-a="u">↑</button><button class="mini" data-i="'+i+'" data-a="d">↓</button><button class="mini" data-i="'+i+'" data-a="x">✕</button></li>'}).join("");
}
$("list").addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 var i=+b.dataset.i,a=b.dataset.a,t;
 if(a==="x")files.splice(i,1);
 else if(a==="u"&&i>0){t=files[i];files[i]=files[i-1];files[i-1]=t}
 else if(a==="d"&&i<files.length-1){t=files[i];files[i]=files[i+1];files[i+1]=t}
 render();
});
$("f").addEventListener("change",function(){
 for(var i=0;i<this.files.length;i++)files.push(this.files[i]);
 this.value="";render();$("err").hidden=true;$("ok").hidden=true;
});
$("clr").onclick=function(){files=[];render();$("err").hidden=true;$("ok").hidden=true};
$("go").onclick=async function(){
 var err=$("err"),ok=$("ok");err.hidden=true;ok.hidden=true;
 if(files.length<2){err.hidden=false;err.textContent=L("Add at least 2 PDF files.","कम से कम 2 PDF फाइलें जोड़ें।");return}
 var btn=$("go"),old=btn.textContent;btn.disabled=true;btn.textContent=L("Working...","काम हो रहा है...");
 try{
  var out=await PDFLib.PDFDocument.create();
  for(var i=0;i<files.length;i++){
   var src=await PDFLib.PDFDocument.load(await files[i].arrayBuffer());
   var pages=await out.copyPages(src,src.getPageIndices());
   pages.forEach(function(p){out.addPage(p)});
  }
  var bytes=await out.save();
  saveBlob(new Blob([bytes],{type:"application/pdf"}),"dtahub-merged.pdf");
  ok.hidden=false;ok.textContent=L("Done ✓ ","हो गया ✓ ")+out.getPageCount()+L(" pages"," पेज");
 }catch(e){
  err.hidden=false;err.textContent=L("Could not merge. A file may be damaged or password protected.","जोड़ नहीं सके। कोई फाइल खराब या पासवर्ड वाली हो सकती है।");
 }
 btn.disabled=false;btn.textContent=old;
};
</script>
</body>
</html>
