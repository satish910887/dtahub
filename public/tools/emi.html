<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMI Calculator - DTAhub</title>
<meta name="description" content="Free online EMI calculator with chart. Calculate loan EMI, total interest and total payment instantly.">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/tool.css">
</head>
<body>
<div class="bg-glow"></div>
<main class="tw">
<a class="back" href="/#tools" data-en="← All tools" data-hi="← सभी टूल्स">← All tools</a>
<h1 data-en="EMI Calculator" data-hi="EMI कैलकुलेटर">EMI Calculator</h1>
<p class="lead" data-en="Find your monthly loan EMI, total interest and total payment." data-hi="लोन की मासिक EMI, कुल ब्याज और कुल भुगतान निकालें।">Find your monthly loan EMI.</p>
<div class="panel">
 <label data-en="Loan amount (₹)" data-hi="लोन राशि (₹)">Loan amount</label>
 <input id="amt" type="number" inputmode="decimal" value="500000" min="0">
 <div class="two">
  <div><label data-en="Interest rate (% per year)" data-hi="ब्याज दर (% सालाना)">Rate</label><input id="rate" type="number" inputmode="decimal" value="9" min="0" step="0.1"></div>
  <div><label data-en="Tenure" data-hi="अवधि">Tenure</label><input id="ten" type="number" inputmode="decimal" value="5" min="1"></div>
 </div>
 <div class="seg">
  <button class="chip on" id="uy" data-en="Years" data-hi="साल">Years</button>
  <button class="chip" id="um" data-en="Months" data-hi="महीने">Months</button>
 </div>
</div>
<div class="panel" id="res" hidden>
 <div class="stats">
  <div class="stat big"><small data-en="Monthly EMI" data-hi="मासिक EMI">Monthly EMI</small><b id="o-emi"></b></div>
  <div class="stat"><small data-en="Total interest" data-hi="कुल ब्याज">Total interest</small><b id="o-int"></b></div>
  <div class="stat"><small data-en="Total payment" data-hi="कुल भुगतान">Total payment</small><b id="o-tot"></b></div>
 </div>
 <div class="chart">
  <svg viewBox="0 0 100 100" role="img" aria-label="Chart">
   <circle cx="50" cy="50" r="38" fill="none" stroke="#8b5cf6" stroke-width="14"/>
   <circle id="arc" cx="50" cy="50" r="38" fill="none" stroke="#f5d27a" stroke-width="14" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 50 50)"/>
  </svg>
  <div class="legend">
   <span><i class="dot" style="background:#f5d27a"></i><em id="l-p"></em></span>
   <span><i class="dot" style="background:#8b5cf6"></i><em id="l-i"></em></span>
  </div>
 </div>
</div>
</main>
<script src="/js/tool.js"></script>
<script>
var unit="y";
function calc(){
 var P=+$("amt").value,R=+$("rate").value,T=+$("ten").value;
 if(!(P>0)||!(R>=0)||!(T>0)){$("res").hidden=true;return}
 var n=unit==="y"?T*12:T,r=R/1200;
 var emi=r===0?P/n:P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
 var tot=emi*n,intr=tot-P,pp=P/tot*100;
 $("res").hidden=false;
 $("o-emi").textContent="₹ "+fmt(emi);
 $("o-int").textContent="₹ "+fmt(intr);
 $("o-tot").textContent="₹ "+fmt(tot);
 $("arc").setAttribute("stroke-dasharray",pp.toFixed(2)+" "+(100-pp).toFixed(2));
 $("l-p").textContent=L("Principal","मूलधन")+" "+pp.toFixed(1)+"%";
 $("l-i").textContent=L("Interest","ब्याज")+" "+(100-pp).toFixed(1)+"%";
}
document.querySelectorAll("input").forEach(function(i){i.addEventListener("input",calc)});
$("uy").onclick=function(){unit="y";$("uy").classList.add("on");$("um").classList.remove("on");calc()};
$("um").onclick=function(){unit="m";$("um").classList.add("on");$("uy").classList.remove("on");calc()};
document.addEventListener("langchange",calc);
calc();
</script>
</body>
</html>
