<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code Generator - DTAhub</title>
<meta name="description" content="Free QR code generator. Create a QR code for any link or text and download it as PNG.">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/tool.css">
</head>
<body>
<div class="bg-glow"></div>
<main class="tw">
<a class="back" href="/#tools" data-en="← All tools" data-hi="← सभी टूल्स">← All tools</a>
<h1 data-en="QR Code Generator" data-hi="QR कोड बनाएं">QR Code Generator</h1>
<p class="lead" data-en="Make a QR code for any link or text and download it." data-hi="किसी भी लिंक या टेक्स्ट का QR कोड बनाएं और डाउनलोड करें।">QR code.</p>
<div class="panel">
 <label data-en="Text or link" data-hi="टेक्स्ट या लिंक">Text</label>
 <textarea id="t" style="min-height:90px" placeholder="https://dtahub.pages.dev"></textarea>
 <div class="two">
  <div><label data-en="Size" data-hi="साइज़">Size</label>
   <select id="sz"><option value="256">256 px</option><option value="512" selected>512 px</option><option value="1024">1024 px</option></select></div>
  <div><label data-en="Error correction" data-hi="एरर करेक्शन">Level</label>
   <select id="ec"><option value="L">Low</option><option value="M" selected>Medium</option><option value="Q">Quartile</option><option value="H">High</option></select></div>
 </div>
 <div class="err" id="err" hidden></div>
</div>
<div class="panel" id="res" hidden>
 <div class="qrbox"><canvas id="cv" width="256" height="256"></canvas></div>
 <div class="seg" style="justify-content:center"><button class="btn gold" id="dl" data-en="Download PNG" data-hi="PNG डाउनलोड करें">Download PNG</button></div>
</div>
</main>
<script src="/js/vendor/qrcode.js"></script>
<script src="/js/tool.js"></script>
<script>
if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs["UTF-8"])qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];
function draw(){
 var t=$("t").value,err=$("err");
 err.hidden=true;
 if(!t){$("res").hidden=true;return}
 try{
  var q=qrcode(0,$("ec").value);q.addData(t);q.make();
  var n=q.getModuleCount(),size=+$("sz").value,margin=4,cell=Math.max(1,Math.floor(size/(n+margin*2)));
  var px=cell*(n+margin*2),c=$("cv"),x=c.getContext("2d");
  c.width=px;c.height=px;
  x.fillStyle="#fff";x.fillRect(0,0,px,px);x.fillStyle="#000";
  for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+margin)*cell,(r+margin)*cell,cell,cell);
  $("res").hidden=false;
 }catch(e){
  $("res").hidden=true;err.hidden=false;
  err.textContent=L("Text is too long for a QR code.","टेक्स्ट QR कोड के लिए बहुत लंबा है।");
 }
}
$("t").addEventListener("input",draw);
$("sz").onchange=draw;$("ec").onchange=draw;
$("dl").onclick=function(){var a=document.createElement("a");a.href=$("cv").toDataURL("image/png");a.download="dtahub-qr.png";document.body.appendChild(a);a.click();document.body.removeChild(a)};
</script>
</body>
</html>
