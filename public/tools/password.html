<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Generator - DTAhub</title>
<meta name="description" content="Free strong password generator. Random, secure passwords created on your device. Nothing is stored or sent.">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/tool.css">
</head>
<body>
<div class="bg-glow"></div>
<main class="tw">
<a class="back" href="/#tools" data-en="← All tools" data-hi="← सभी टूल्स">← All tools</a>
<h1 data-en="Password Generator" data-hi="पासवर्ड जनरेटर">Password Generator</h1>
<p class="lead" data-en="Strong random passwords made on your device. Nothing is saved or sent." data-hi="मज़बूत रैंडम पासवर्ड आपके फोन पर ही बनते हैं। कुछ भी सेव या भेजा नहीं जाता।">Passwords.</p>
<div class="panel">
 <div class="pw" id="pw"></div>
 <p class="line" id="st"></p>
 <div class="seg">
  <button class="btn gold" id="cp" data-en="Copy" data-hi="कॉपी करें">Copy</button>
  <button class="btn" id="rg" data-en="New password" data-hi="नया पासवर्ड">New</button>
 </div>
</div>
<div class="panel">
 <label><span data-en="Length" data-hi="लंबाई">Length</span>: <b id="lv">16</b></label>
 <input id="len" type="range" min="6" max="64" value="16">
 <label class="chk"><input id="u" type="checkbox" checked><span data-en="Uppercase (A-Z)" data-hi="बड़े अक्षर (A-Z)">Upper</span></label>
 <label class="chk"><input id="l" type="checkbox" checked><span data-en="Lowercase (a-z)" data-hi="छोटे अक्षर (a-z)">Lower</span></label>
 <label class="chk"><input id="n" type="checkbox" checked><span data-en="Numbers (0-9)" data-hi="अंक (0-9)">Numbers</span></label>
 <label class="chk"><input id="s" type="checkbox" checked><span data-en="Symbols (!@#$)" data-hi="चिह्न (!@#$)">Symbols</span></label>
 <div class="err" id="err" hidden></div>
</div>
</main>
<script src="/js/tool.js"></script>
<script>
var SETS={u:"ABCDEFGHIJKLMNOPQRSTUVWXYZ",l:"abcdefghijklmnopqrstuvwxyz",n:"0123456789",s:"!@#$%^&*()-_=+[]{};:,.?"};
function rnd(n){var lim=Math.floor(4294967296/n)*n,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
function gen(){
 var len=+$("len").value,sets=[],pool="";
 $("lv").textContent=len;
 ["u","l","n","s"].forEach(function(k){if($(k).checked){sets.push(SETS[k]);pool+=SETS[k]}});
 if(!sets.length){$("err").hidden=false;$("err").textContent=L("Select at least one option.","कम से कम एक विकल्प चुनें।");$("pw").textContent="";$("st").textContent="";return}
 $("err").hidden=true;
 var p=[];
 sets.forEach(function(s){p.push(s[rnd(s.length)])});
 while(p.length<len)p.push(pool[rnd(pool.length)]);
 for(var i=p.length-1;i>0;i--){var j=rnd(i+1),t=p[i];p[i]=p[j];p[j]=t}
 $("pw").textContent=p.join("");
 var bits=len*Math.log2(pool.length);
 var lbl=bits<40?L("Weak","कमज़ोर"):bits<60?L("Fair","ठीक-ठाक"):bits<80?L("Strong","मज़बूत"):L("Very strong","बहुत मज़बूत");
 $("st").textContent=lbl+" • ~"+Math.round(bits)+" bits";
}
["len","u","l","n","s"].forEach(function(k){$(k).addEventListener("input",gen)});
$("rg").onclick=gen;
$("cp").onclick=function(){copyText($("pw").textContent,$("cp"))};
document.addEventListener("langchange",gen);
gen();
</script>
</body>
</html>
