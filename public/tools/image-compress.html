<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compress Image - DTAhub</title>
<meta name="description" content="Free image compressor. Reduce JPG, PNG and WebP photo size online. Your photo never leaves your device.">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/tool.css">
</head>
<body>
<div class="bg-glow"></div>
<main class="tw">
<a class="back" href="/#tools" data-en="← All tools" data-hi="← सभी टूल्स">← All tools</a>
<h1 data-en="Compress Image" data-hi="इमेज छोटी करें">Compress Image</h1>
<p class="lead" data-en="Make photos smaller. Everything happens on your phone, nothing is uploaded." data-hi="फोटो का साइज़ घटाएं। सब कुछ आपके फोन पर होता है, कुछ अपलोड नहीं होता।">Compress.</p>
<div class="panel">
 <label class="drop"><input id="f" type="file" accept="image/*"><span id="dt" data-en="Tap to choose a photo" data-hi="फोटो चुनने के लिए टैप करें">Tap to choose a photo</span></label>
 <div id="ctl" hidden>
  <label><span data-en="Quality" data-hi="क्वालिटी">Quality</span>: <b id="qv">70</b>%</label>
  <input id="q" type="range" min="10" max="100" value="70">
  <label data-en="Output format" data-hi="आउटपुट फॉर्मेट">Format</label>
  <select id="fmt"><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select>
 </div>
 <div class="err" id="err" hidden></div>
</div>
<div class="panel" id="res" hidden>
 <div class="stats">
  <div class="stat"><small data-en="Original" data-hi="असली साइज़">Original</small><b id="so"></b></div>
  <div class="stat"><small data-en="Compressed" data-hi="छोटा साइज़">Compressed</small><b id="sn"></b></div>
  <div class="stat big"><small data-en="Saved" data-hi="बचत">Saved</small><b id="sv"></b></div>
 </div>
 <img id="pv" class="pimg" alt="">
 <div class="seg" style="justify-content:center"><button class="btn gold" id="dl" data-en="Download" data-hi="डाउनलोड करें">Download</button></div>
</div>
</main>
<script src="/js/tool.js"></script>
<script src="/js/img.js"></script>
<script>
var im=null,file=null,blob=null,url=null,tm=null;
function run(){
 if(!im)return;
 $("qv").textContent=$("q").value;
 renderImg(im,im.naturalWidth,im.naturalHeight,$("fmt").value,+$("q").value/100).then(function(b){
  if(!b){$("err").hidden=false;$("err").textContent=L("This format is not supported on your browser.","आपके ब्राउज़र में यह फॉर्मेट सपोर्ट नहीं है।");return}
  $("err").hidden=true;blob=b;
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(b);$("pv").src=url;
  var saved=(1-b.size/file.size)*100;
  $("so").textContent=sizeOf(file.size);$("sn").textContent=sizeOf(b.size);
  $("sv").textContent=saved>0?saved.toFixed(1)+" %":L("Already small. Try lower quality.","पहले से छोटी है। क्वालिटी कम करके देखें।");
  $("res").hidden=false;
 });
}
pickImage($("f"),function(i,f){
 if(!i){$("err").hidden=false;$("err").textContent=L("Could not open this image.","यह इमेज नहीं खुल सकी।");return}
 im=i;file=f;$("ctl").hidden=false;$("dt").textContent=f.name;run();
});
$("q").addEventListener("input",function(){$("qv").textContent=$("q").value;clearTimeout(tm);tm=setTimeout(run,200)});
$("fmt").onchange=run;
$("dl").onclick=function(){if(blob)saveBlob(blob,baseName(file)+"-compressed."+extOf(blob.type))};
document.addEventListener("langchange",function(){if(im)run()});
</script>
</body>
</html>
