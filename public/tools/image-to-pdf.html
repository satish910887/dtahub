<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image to PDF - DTAhub</title>
<meta name="description" content="Free image to PDF converter. Turn JPG, PNG and WebP photos into one PDF. Private, works on your device.">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/tool.css">
</head>
<body>
<div class="bg-glow"></div>
<main class="tw">
<a class="back" href="/#tools" data-en="← All tools" data-hi="← सभी टूल्स">← All tools</a>
<h1 data-en="Image to PDF" data-hi="इमेज से PDF">Image to PDF</h1>
<p class="lead" data-en="Turn one or many photos into a single PDF." data-hi="एक या कई फोटो से एक PDF बनाएं।">Image to PDF.</p>
<div class="panel">
 <label class="drop"><input id="f" type="file" accept="image/*" multiple><span data-en="Tap to add photos" data-hi="फोटो जोड़ने के लिए टैप करें">Tap to add photos</span></label>
 <ul class="fl" id="list"></ul>
 <label data-en="Page size" data-hi="पेज साइज़">Page size</label>
 <select id="ps"><option value="a4">A4 (fit photo with margin)</option><option value="fit">Same as photo</option></select>
 <div class="err" id="err" hidden></div>
 <div class="ok" id="ok" hidden></div>
 <div class="seg"><button class="btn gold" id="go" data-en="Create PDF" data-hi="PDF बनाएं">Create PDF</button><button class="btn" id="clr" data-en="Clear" data-hi="साफ करें">Clear</button></div>
</div>
</main>
<script src="/js/vendor/pdf-lib.min.js"></script>
<script src="/js/tool.js"></script>
<script src="/js/img.js"></script>
<script>
var files=[];
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function render(){
 $("list").innerHTML=files.map(function(f,i){
  return '<li><span class="nm">'+(i+1)+'. '+esc(f.name)+'<small>'+sizeOf(f.size)+'</small></span><button class="mini" data-i="'+i+'" data-a="u">↑</button><button class="mini" data-i="'+i+'" data-a="d">↓</button><button class="mini" data-i="'+i+'" data-a="x">✕</button></li>'}).join("");
}
$("list").addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 var i=+b.dataset.i,a=b.dataset.a,t;
 if(a==="x")files.splice(i,1);
 else if(a==="u"&&i>0){t=files[i];files[i]=files[i-1];files[i-1]=t}
 else if(a==="d"&&i<files.length-1){t=files[i];files[i]=files[i+1];files[i+1]=t}
 render();
});
$("f").addEventListener("change",function(){
 for(var i=0;i<this.files.length;i++)files.push(this.files[i]);
 this.value="";render();$("err").hidden=true;$("ok").hidden=true;
});
$("clr").onclick=function(){files=[];render();$("err").hidden=true;$("ok").hidden=true};
function load(f){
 return new Promise(function(res,rej){
  var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){URL.revokeObjectURL(u);res(im)};
  im.onerror=function(){URL.revokeObjectURL(u);rej(new Error("img"))};
  im.src=u;
 });
}
async function toJpg(f){
 var im=await load(f),w=im.naturalWidth,h=im.naturalHeight,m=Math.max(w,h);
 if(m>2200){var s=2200/m;w=Math.round(w*s);h=Math.round(h*s)}
 var b=await renderImg(im,w,h,"image/jpeg",0.9);
 return {bytes:await b.arrayBuffer(),w:w,h:h};
}
$("go").onclick=async function(){
 var err=$("err"),ok=$("ok");err.hidden=true;ok.hidden=true;
 if(!files.length){err.hidden=false;err.textContent=L("Add at least 1 photo.","कम से कम 1 फोटो जोड़ें।");return}
 var btn=$("go"),old=btn.textContent;btn.disabled=true;btn.textContent=L("Working...","काम हो रहा है...");
 try{
  var doc=await PDFLib.PDFDocument.create(),fit=$("ps").value==="fit";
  for(var i=0;i<files.length;i++){
   var d=await toJpg(files[i]),img=await doc.embedJpg(d.bytes),page;
   if(fit){page=doc.addPage([d.w,d.h]);page.drawImage(img,{x:0,y:0,width:d.w,height:d.h})}
   else{
    var PW=595.28,PH=841.89,mg=24,s=Math.min((PW-2*mg)/d.w,(PH-2*mg)/d.h),w=d.w*s,h=d.h*s;
    page=doc.addPage([PW,PH]);page.drawImage(img,{x:(PW-w)/2,y:(PH-h)/2,width:w,height:h});
   }
  }
  var bytes=await doc.save();
  saveBlob(new Blob([bytes],{type:"application/pdf"}),"dtahub-images.pdf");
  ok.hidden=false;ok.textContent=L("Done ✓ ","हो गया ✓ ")+files.length+L(" pages"," पेज");
 }catch(e){
  err.hidden=false;err.textContent=L("Could not create the PDF. Try fewer or smaller photos.","PDF नहीं बनी। कम या छोटी फोटो आज़माएं।");
 }
 btn.disabled=false;btn.textContent=old;
};
</script>
</body>
</html>
