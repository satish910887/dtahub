<h1 data-en="Privacy Policy" data-hi="प्राइवेसी पॉलिसी">Privacy Policy</h1>
<p data-en="Last updated: November 2026" data-hi="आखिरी अपडेट: नवंबर 2026">Last updated</p>
<h2 data-en="Your files stay on your device" data-hi="आपकी फाइलें आपके डिवाइस पर रहती हैं">Files</h2>
<p data-en="DTAhub tools (PDF, image, text, calculators and others) run inside your browser. Your photos, PDFs and text are not uploaded to our servers." data-hi="DTAhub के टूल्स (PDF, इमेज, टेक्स्ट, कैलकुलेटर आदि) आपके ब्राउज़र में ही चलते हैं। आपकी फोटो, PDF और टेक्स्ट हमारे सर्वर पर अपलोड नहीं होते।">Files stay local.</p>
<h2 data-en="What we store" data-hi="हम क्या सेव करते हैं">Storage</h2>
<p data-en="We save only your theme (dark or light) and language choice in your browser's local storage. We do not ask you to create an account." data-hi="हम सिर्फ आपका थीम (डार्क या लाइट) और भाषा आपके ब्राउज़र में सेव करते हैं। हम अकाउंट नहीं मांगते।">Storage.</p>
<h2 data-en="Analytics and advertising" data-hi="एनालिटिक्स और विज्ञापन">Analytics</h2>
<p data-en="We may use privacy-friendly analytics to count visits. In future we may show ads (for example Google AdSense). Ad partners may use cookies to show relevant ads, and you can control this in your browser or Google ad settings. This page will be updated before ads start." data-hi="हम विज़िट गिनने के लिए प्राइवेसी-फ्रेंडली एनालिटिक्स इस्तेमाल कर सकते हैं। भविष्य में हम विज्ञापन (जैसे Google AdSense) दिखा सकते हैं। विज्ञापन पार्टनर कुकीज़ इस्तेमाल कर सकते हैं, जिसे आप ब्राउज़र या Google ad settings में बदल सकते हैं। विज्ञापन शुरू होने से पहले यह पेज अपडेट होगा।">Analytics and ads.</p>
<h2 data-en="Contact" data-hi="संपर्क">Contact</h2>
<p data-en="Questions about privacy? Use the Contact page." data-hi="प्राइवेसी से जुड़े सवाल हों तो Contact पेज इस्तेमाल करें।">Contact.</p>
